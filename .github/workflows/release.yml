# Ships a tagged version of the plugin two ways, from GitHub Actions.
#
# - GitHub repository & release: `magpie plugin add github:sidkang/agy-acp`
#   installs directly from the repository default branch (`main`), while the
#   GitHub Release job attaches the versioned tarball
#   (`magpie-agy-acp-<version>.tgz`) to the tag's release.
# - npm: publishes `magpie-agy-acp` when this repository is configured to do so
#   (which also makes `magpie-community/plugins`'s `tagged.json` upgrade `spec`
#   to `magpie-agy-acp` and enables listing in
#   `magpie-community/plugins/registry.json`). npm's OIDC Trusted Publishing
#   needs no secret (`npx npm@latest trust github magpie-agy-acp --file
#   release.yml --repo sidkang/agy-acp --allow-publish
#   --registry=https://registry.npmjs.org/ -y`), and a granular `NPM_TOKEN`
#   secret is the fallback. npm publishing is attempted by default and every
#   publish failure is fatal. Set the repository Actions variable
#   SKIP_NPM_PUBLISH=true to ship only the GitHub release.
#
# Every check `ci` runs runs again here against the tagged commit, and the tag
# must name the version in package.json (`scripts/check-release.mjs --tag`).
#
# The archive is always packed into and selected from a dedicated directory.
# Never select it with a repository-root glob: a checkout may contain unrelated
# archives, and passing more than one to npm or gh changes their behavior.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (v<major>.<minor>.<patch>); empty for a dry run"
        required: false
        type: string

permissions:
  contents: read

concurrency: release

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      # Empty for a dry run: the jobs that publish key off this, never off the
      # trigger, so a dispatch either names a tag or ships nothing.
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag=""
          if [ -n "${INPUT_TAG}" ]; then
            if ! printf '%s' "${INPUT_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag '${INPUT_TAG}' is not v<major>.<minor>.<patch>" >&2
              exit 1
            fi
            tag="${INPUT_TAG}"
            ref="refs/tags/${tag}"
          elif [ "${REF_TYPE}" = "tag" ] && [ "${REF_NAME#v}" != "${REF_NAME}" ]; then
            tag="${REF_NAME}"
            ref="refs/tags/${tag}"
          else
            # Not a tag: check out what we were given and ship nothing.
            ref="${DEFAULT_REF}"
          fi
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "releasing '${tag:-<dry run>}' from ${ref}"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: HOME=$(mktemp -d) bun x tsc --noEmit
      - name: test
        run: HOME=$(mktemp -d) bun test
      - name: check (release gate)
        env:
          TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          if [ -n "$TAG" ]; then
            HOME=$(mktemp -d) bun scripts/check-release.mjs --tag "$TAG"
          else
            HOME=$(mktemp -d) bun scripts/check-release.mjs
          fi
      - name: pack
        id: pack
        run: |
          set -euo pipefail
          pack_dir="${RUNNER_TEMP}/npm-tarball"
          rm -rf "$pack_dir"
          mkdir -p "$pack_dir"
          npm pack --ignore-scripts --json --pack-destination "$pack_dir" > "${RUNNER_TEMP}/npm-pack.json"
          packed_name="$(
            node -e '
              const fs = require("node:fs");
              const entries = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!Array.isArray(entries) || entries.length !== 1 || typeof entries[0].filename !== "string") {
                throw new Error("npm pack must report exactly one archive");
              }
              process.stdout.write(entries[0].filename);
            ' "${RUNNER_TEMP}/npm-pack.json"
          )"
          tarball="$(bash scripts/release-artifact.sh "$pack_dir")"
          if [ "$(basename "$tarball")" != "$packed_name" ]; then
            echo "::error::npm pack reported ${packed_name}, but the pack directory contains ${tarball}" >&2
            exit 1
          fi
          echo "tarball_path=${tarball}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball_path }}
          if-no-files-found: error

  github-release:
    needs: verify
    if: needs.verify.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag's release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.verify.outputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/release-artifact
      - name: resolve release artifact
        id: artifact
        run: |
          set -euo pipefail
          echo "path=$(bash scripts/release-artifact.sh "${RUNNER_TEMP}/release-artifact")" >> "$GITHUB_OUTPUT"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.release_tag }}
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARTIFACT_PATH" --clobber
          else
            gh release create "$TAG" "$ARTIFACT_PATH" --generate-notes --title "$TAG"
          fi

  npm-publish:
    needs: verify
    if: needs.verify.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm's OIDC trusted-publishing exchange
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.verify.outputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5+, which speaks trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/release-artifact
      - name: resolve release artifact
        id: artifact
        run: |
          set -euo pipefail
          echo "path=$(bash scripts/release-artifact.sh "${RUNNER_TEMP}/release-artifact")" >> "$GITHUB_OUTPUT"
      - name: publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          SKIP_NPM_PUBLISH: ${{ vars.SKIP_NPM_PUBLISH }}
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
        run: bash scripts/npm-publish.sh "$ARTIFACT_PATH"
